<style>

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  .o2 { width: 620px; height: 620px; right: -160px; top: -120px; background: radial-gradient(circle at 50% 50%, rgba(255,138,96,0.55), rgba(255,255,255,0) 68%); }

  .sub { margin-top: 14px; font-size: 30px; line-height: 1.5; font-weight: 700; color: #3B4A58; }
  .chips { margin-top: 30px; display: flex; gap: 14px; }
  .chip {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.92); border: 1px solid rgba(44,62,80,0.09);
    border-radius: 999px; padding: 11px 22px; font-size: 24px; font-weight: 800;
    box-shadow: 0 16px 30px -22px rgba(31,45,58,0.5);
  }
  svg.i { fill: none; stroke: #1F2D3A; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .shell {
    position: absolute; right: 64px; top: 84px; width: 420px; height: 456px;

    box-shadow: 0 60px 90px -50px rgba(122,92,0,0.55);
  }
  .core {
    width: 100%; height: 100%; border-radius: 46px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    box-shadow: inset 0 2px 2px rgba(255,255,255,0.9);
  }
  .core img.logo { width: 320px; height: auto; }
  .scan { display: flex; align-items: center; gap: 22px; }
  .qr {
    width: 184px; height: 184px; padding: 22px; border-radius: 28px; background: #fff;
    border: 2px solid rgba(31,45,58,0.12);
    box-shadow: 0 18px 30px -20px rgba(31,45,58,0.5);
  }
  .qr svg { width: 100%; height: 100%; display: block; }
  .scan-text { font-size: 30px; line-height: 1.3; font-weight: 800; }
  .scan-text small { display: block; margin-top: 6px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 800; color: #E08A00; }

  .float { position: absolute; }
  .f1 { right: 40px; top: 46px; transform: rotate(14deg); }
  .f3 { right: 26px; bottom: 44px; transform: rotate(-16deg); }
  .f4 { left: 710px; top: 70px; transform: rotate(8deg); }
  .disc { width: 80px; height: 80px; border-radius: 40px; display: flex; align-items: center; justify-content: center; box-shadow: 0 24px 36px -22px rgba(31,45,58,0.55); }
  .url { position: absolute; left: 72px; bottom: 42px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
  .url b { color: #E08A00; }
</style>
